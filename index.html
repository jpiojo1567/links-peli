<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi TV</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0f1115; color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 40px 60px 10px;
  }
  header h1 { margin: 0; font-size: 48px; font-weight: normal; }
  #reloj { font-size: 40px; color: #9aa4b2; }
  h2 {
    margin: 30px 60px 10px; font-size: 30px; font-weight: normal;
    color: #9aa4b2; text-transform: uppercase; letter-spacing: 2px;
  }
  .grid {
    display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap;
    padding: 10px 50px;
  }
  .tile {
    display: block;
    width: 280px; height: 160px; margin: 12px;
    padding: 20px;
    background: #1c212b; color: #fff;
    border-radius: 14px; border: 4px solid transparent;
    text-decoration: none; font-size: 30px;
    -webkit-transition: -webkit-transform .15s, background .15s;
    transition: transform .15s, background .15s;
    outline: none;
  }
  .tile small { display: block; margin-top: 8px; font-size: 20px; color: #8b95a5; }
  .tile:focus, .tile:hover {
    background: #2b6ef5; border-color: #fff;
    -webkit-transform: scale(1.08); transform: scale(1.08);
  }
  .tile:focus small, .tile:hover small { color: #dbe6ff; }

  #aviso {
    position: fixed; left: 50%; bottom: 40px;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    padding: 18px 36px; border-radius: 12px;
    background: #222; color: #fff; font-size: 30px;
    opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s;
    pointer-events: none;
  }
  #aviso.ok { background: #1f9d55; }
  #aviso.error { background: #c0392b; }
  #aviso.visible { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Mi TV</h1>
  <div id="reloj"></div>
</header>

<!-- ============================================================
     PARA AGREGAR UN LINK: copiá una línea <a class="tile" ...>
     y cambiá el href, el título y la descripción (opcional).
     ============================================================ -->

<h2>Videos</h2>
<div class="grid">
  <a class="tile" href="https://www.ok.ru/video/showcase">OK.ru<small>videos</small></a>
  <a class="tile" href="https://www.twitch.tv">Twitch<small>twitch.tv</small></a>
</div>

<h2>Youtube Canales</h2>
<div class="grid">
 <a class="tile" href="https://www.youtube.com/@NicoGuthmann">Nico<small>Tuguito</small></a>
  <a class="tile" href="https://www.youtube.com/@SomosGelatina">Gelatina<small>Gelatina</small></a>
  <a class="tile" href="https://www.youtube.com/@Radioconvos89.9">Radio Con vos<small>Radio con Vos</small></a>
 <a class="tile" href="https://www.youtube.com/@Futurock">Futurock<small>Futu</small></a>
</div>

<h2>Noticias</h2>
<div class="grid">
  <a class="tile" href="https://www.clarin.com">Clarín<small>clarin.com</small></a>
  <a class="tile" href="https://www.lanacion.com.ar">La Nación<small>lanacion.com.ar</small></a>
</div>

<h2>Otros</h2>
<div class="grid">
  <a class="tile" href="https://www.google.com">Google<small>google.com</small></a>
  <a class="tile" href="https://www.wikipedia.org">Wikipedia<small>wikipedia.org</small></a>
</div>

<!-- ============================================================
     BOTONES POST: usan data-post (URL) y data-body (JSON).
     Para agregar otro, copiá la línea y cambiá esos dos valores.
     ============================================================ -->
<h2>Acciones</h2>
<div class="grid">
  <a class="tile" href="#"
     data-post="https://otrositio.com/endpoint"
     data-body='{"accion":"encender","dispositivo":"luz_living"}'>Encender luz<small>POST</small></a>
  <a class="tile" href="#"
     data-post="https://otrositio.com/endpoint"
     data-body='{"accion":"apagar","dispositivo":"luz_living"}'>Apagar luz<small>POST</small></a>
</div>

<div id="aviso"></div>

<script>
(function () {
  // ---- Aviso en pantalla ----
  var aviso = document.getElementById('aviso');
  var avisoTimer = null;
  function mostrarAviso(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = 'visible ' + (tipo || '');
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { aviso.className = ''; }, 3000);
  }

  // ---- POST genérico: función que recibe la URL y el cuerpo ----
  function enviarPost(url, datos, etiqueta) {
    mostrarAviso('Enviando...');
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datos)
    })
    .then(function (r) {
      if (r.ok) mostrarAviso(etiqueta + ': enviado', 'ok');
      else mostrarAviso(etiqueta + ': error ' + r.status, 'error');
    })
    .catch(function () {
      mostrarAviso(etiqueta + ': no se pudo enviar (red o CORS)', 'error');
    });
  }

  // Todos los tiles con data-post usan la misma función
  var botonesPost = document.querySelectorAll('.tile[data-post]');
  for (var b = 0; b < botonesPost.length; b++) {
    botonesPost[b].addEventListener('click', function (e) {
      e.preventDefault();
      var url = this.getAttribute('data-post');
      var datos = {};
      try { datos = JSON.parse(this.getAttribute('data-body') || '{}'); }
      catch (err) { mostrarAviso('JSON inválido en data-body', 'error'); return; }
      enviarPost(url, datos, this.firstChild.textContent);
    });
  }

  // ---- Reloj ----
  var reloj = document.getElementById('reloj');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    reloj.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 10000);

  // ---- Navegación con control remoto (flechas) ----
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, BACK: 461, BACKSPACE: 8 };

  function tiles() {
    return Array.prototype.slice.call(document.querySelectorAll('.tile'));
  }

  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function mover(dir) {
    var actual = document.activeElement;
    var lista = tiles();
    if (!actual || lista.indexOf(actual) === -1) {
      if (lista.length) lista[0].focus();
      return;
    }
    var c = center(actual), mejor = null, mejorScore = Infinity;
    for (var i = 0; i < lista.length; i++) {
      var el = lista[i];
      if (el === actual) continue;
      var p = center(el), dx = p.x - c.x, dy = p.y - c.y, ok = false, main, cross;
      if (dir === KEY.RIGHT) { ok = dx > 10;  main = dx;  cross = Math.abs(dy); }
      if (dir === KEY.LEFT)  { ok = dx < -10; main = -dx; cross = Math.abs(dy); }
      if (dir === KEY.DOWN)  { ok = dy > 10;  main = dy;  cross = Math.abs(dx); }
      if (dir === KEY.UP)    { ok = dy < -10; main = -dy; cross = Math.abs(dx); }
      if (!ok) continue;
      var score = main + cross * 2;
      if (score < mejorScore) { mejorScore = score; mejor = el; }
    }
    if (mejor) {
      mejor.focus();
      if (mejor.scrollIntoView) {
        try { mejor.scrollIntoView({ block: 'center' }); } catch (e) { mejor.scrollIntoView(); }
      }
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === KEY.LEFT || k === KEY.UP || k === KEY.RIGHT || k === KEY.DOWN) {
      e.preventDefault();
      mover(k);
    } else if (k === KEY.BACK || k === KEY.BACKSPACE) {
      e.preventDefault();
      if (window.history.length > 1) window.history.back();
    }
  });

  // Foco inicial
  var t = tiles();
  if (t.length) t[0].focus();
})();
</script>
</body>
</html>
